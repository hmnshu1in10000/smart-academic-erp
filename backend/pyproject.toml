[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "smart-academic-erp-backend"
version = "0.1.0"
description = "AI-Powered Smart Academic ERP — Backend (Phase 1)"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Database
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",   # async SQLite driver
    # Dummy data generation
    "faker>=25.0.0",
    # CLI & logging
    "rich>=13.7.0",
    "click>=8.1.7",
    # Environment
    "python-dotenv>=1.0.1",
    # Dev utilities
    "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "modules*", "shared_kernel*", "config*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
